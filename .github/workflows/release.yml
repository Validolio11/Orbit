name: Release Orbit
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version." }
          $p = Start-Process -FilePath target\release\orbit.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Self-test failed.' }
          New-Item -ItemType Directory -Force release | Out-Null
          # One executable: the portable copy, and the same file named as the installer (it installs itself under that name).
          Copy-Item target\release\orbit.exe "release\Orbit-$version-windows-x64.exe"
          Copy-Item target\release\orbit.exe "release\Orbit-Setup-$version.exe"
          Get-ChildItem release\*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          "ORBIT_VERSION=$version" | Out-File -Append $env:GITHUB_ENV
      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "release\Orbit-Setup-$env:ORBIT_VERSION.exe" -ArgumentList '--silent', '--nolaunch' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed.' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Orbit\Orbit.exe")) { throw 'Orbit.exe was not installed.' }
      - name: Publish release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:ORBIT_VERSION" "release/Orbit-$env:ORBIT_VERSION-windows-x64.exe" "release/Orbit-Setup-$env:ORBIT_VERSION.exe" "release/SHA256SUMS.txt" --verify-tag --title "Orbit $env:ORBIT_VERSION" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit "v$env:ORBIT_VERSION" --draft=false --latest
