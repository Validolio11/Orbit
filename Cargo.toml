[package]
name = "orbit"
version = "0.2.0"
description = "Orbit — a mouse-first radial launcher for Windows"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.29.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
  "Win32_System_Registry", "Win32_Security", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
